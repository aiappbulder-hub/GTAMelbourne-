<!doctype html><meta charset="utf-8"><title>people look webgpu</title>
<style>html,body{margin:0}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js","three/webgpu":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"}}</script>
<script type="module">
// The same check through the game's renderer (three.js WebGPURenderer; ?webgl forces its WebGL 2 backend)
import * as THREE from 'three/webgpu';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGPURenderer({ antialias: true, forceWebGL: q.has('webgl') });
r.setSize(400, 600); document.body.append(r.domElement); await r.init();
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9fb4c8);
scene.add(new THREE.HemisphereLight(0xdfeaff, 0x5a5040, 1.3));
const sun = new THREE.DirectionalLight(0xfff1dd, 2.6); sun.position.set(3, 6, 4); scene.add(sun);
const g = await new GLTFLoader().loadAsync(`../../assets/people/${q.get('n') || 'Male_Adult_09'}.glb`);
const clips = await fetch('../../assets/people/clips-m.json').then((x) => x.json());
const m = q.has('clone') ? SkeletonUtils.clone(g.scene) : g.scene; scene.add(m);
const mixer = new THREE.AnimationMixer(m); mixer.clipAction(THREE.AnimationClip.parse(clips.clips.find((c) => c.name === 'walk'))).play(); mixer.update(0.4);
const cam = new THREE.PerspectiveCamera(35, 400 / 600, 0.05, 50); cam.position.set(0, 1, 3.6); cam.lookAt(0, 0.95, 0);
await r.renderAsync(scene, cam);
const bx = new THREE.Box3().setFromObject(m, true); console.error('BOX ' + bx.min.toArray().map((v) => v.toFixed(2)) + ' / ' + bx.max.toArray().map((v) => v.toFixed(2)));
document.title = 'done';
</script>
