<!doctype html><meta charset="utf-8"><title>people look</title>
<style>html,body{margin:0;background:#888}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
// A converted person mid-gait in daylight: front, three-quarter back, face (for checking the models)
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search), dir = q.get('d') || 'work/out', name = q.get('n'), clipName = q.get('clip') || 'walk', at = +(q.get('t') || 0.3);
const W = 1200, H = 600;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(W, H); r.outputColorSpace = THREE.SRGBColorSpace;
r.toneMapping = THREE.ACESFilmicToneMapping; document.body.append(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9fb4c8);
scene.add(new THREE.HemisphereLight(0xdfeaff, 0x5a5040, 1.3));
const sun = new THREE.DirectionalLight(0xfff1dd, 2.6); sun.position.set(3, 6, 4); scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ color: 0x8a8d90 })); ground.rotation.x = -Math.PI / 2; scene.add(ground);
const sex = name.startsWith('Female') || /_Female_/.test(name) ? 'f' : 'm';
const [g, clips] = await Promise.all([new GLTFLoader().loadAsync(`${dir}/${name}.glb`), fetch(`${dir}/${clipName.startsWith('sit') ? 'sit' : clipName.match(/talk_|listen|nod|wave|cheer|wait|look|text|idle_/) ? 'story' : 'clips'}-${sex}.json`).then((x) => x.json())]);
const m = g.scene; scene.add(m);
const clip = THREE.AnimationClip.parse(clips.clips.find((c) => c.name === clipName));
const mixer = new THREE.AnimationMixer(m); mixer.clipAction(clip).play(); mixer.update(clip.duration * at);
m.updateMatrixWorld(true);
const pel = new THREE.Vector3(); (m.getObjectByName('Bip01_Pelvis') || m).getWorldPosition(pel); console.error('PELVIS ' + pel.toArray().map((v) => v.toFixed(3)));
const head = new THREE.Vector3(); (m.getObjectByName('Bip01_Head') || m).getWorldPosition(head);
const views = [[0, 1.0, 3.6, 0, 0.95, 0], [-2.6, 1.3, -2.6, 0, 0.95, 0], [0.25, head.y + 0.05, head.z + 0.75, head.x, head.y, head.z]];
const cam = new THREE.PerspectiveCamera(35, (W / 3) / H, 0.05, 50);
r.setScissorTest(true);
views.forEach(([x, y, z, lx, ly, lz], i) => {
  const vx = i * W / 3; r.setViewport(vx, 0, W / 3, H); r.setScissor(vx, 0, W / 3, H);
  cam.position.set(x, y, z); cam.lookAt(lx, ly, lz); if (i === 2) { cam.fov = 24; cam.updateProjectionMatrix(); }
  r.render(scene, cam);
});
document.title = 'done';
</script>
